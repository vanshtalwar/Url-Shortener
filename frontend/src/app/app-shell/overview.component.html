<div class="flex flex-wrap items-end justify-between gap-4">
  <div>
    <h1 class="text-2xl font-bold">Overview</h1>
    <p class="mt-1 text-sm text-muted">Human clicks across all your links.</p>
  </div>
  <div *ngIf="me.me$ | async as me" class="inline-flex rounded-xl border border-line bg-surface p-1" role="radiogroup" aria-label="Date range">
    <button *ngFor="let days of ranges" type="button" role="radio" [attr.aria-checked]="(range$ | async) === days" (click)="select(days, me.entitlements.historyDays)"
            class="inline-flex items-center gap-1 rounded-lg px-3 py-1 text-sm font-medium transition-colors"
            [ngClass]="(range$ | async) === days ? 'bg-brand text-white' : 'text-muted hover:text-ink'">
      {{ days }} days<z-icon *ngIf="me.entitlements.historyDays !== null && days > me.entitlements.historyDays" name="lock" [size]="12"></z-icon>
    </button>
  </div>
</div>

<ng-container *ngIf="state$ | async as state">
  <div *ngIf="state.status === 'loading'" class="mt-6 grid gap-4 sm:grid-cols-3" aria-busy="true">
    <div *ngFor="let i of [1, 2, 3]" class="h-28 animate-pulse rounded-2xl bg-surface-2"></div>
    <div class="h-80 animate-pulse rounded-2xl bg-surface-2 sm:col-span-3"></div>
  </div>

  <z-card *ngIf="state.status === 'error'" class="mt-6 text-center">
    <p class="text-muted">Couldn't load your stats.</p>
    <button zButton variant="secondary" class="mt-4" (click)="range$.next(range$.value)">Try again</button>
  </z-card>

  <ng-container *ngIf="state.status === 'ready'">
    <ng-container *ngIf="state.data.totals.links > 0; else empty">
      <div class="mt-6 grid gap-4 sm:grid-cols-3">
        <z-stat-tile label="Clicks" [value]="state.data.totals.clicks | number" [hint]="'Last ' + state.data.days + ' days'"></z-stat-tile>
        <z-stat-tile label="Unique visitors" [value]="state.data.totals.uniques | number" [hint]="'Last ' + state.data.days + ' days'"></z-stat-tile>
        <z-stat-tile label="Links" [value]="state.data.totals.links | number" hint="All time"></z-stat-tile>
      </div>

      <z-card class="mt-4">
        <h2 class="text-base font-semibold">Clicks per day <span class="text-sm font-normal text-muted">(UTC)</span></h2>
        <app-clicks-chart class="mt-4" [days]="state.data.clicksPerDay"></app-clicks-chart>
      </z-card>

      <z-card class="mt-4">
        <h2 class="text-base font-semibold">Top links</h2>
        <p *ngIf="state.data.topLinks.length === 0" class="mt-3 text-sm text-muted">No clicks in this period yet.</p>
        <ol class="mt-3 divide-y divide-line">
          <li *ngFor="let link of state.data.topLinks; let i = index" class="flex items-center gap-3 py-3">
            <span class="w-5 text-sm text-muted">{{ i + 1 }}</span>
            <a [routerLink]="['/app/links', link.id]" class="flex-1 truncate font-mono text-sm text-accent hover:underline">{{ link.code }}</a>
            <span class="text-sm tabular-nums">{{ link.clicks | number }} clicks</span>
          </li>
        </ol>
      </z-card>
    </ng-container>

    <ng-template #empty>
      <z-card class="mt-6 py-12 text-center">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-brand text-white shadow-glow"><z-icon name="link" [size]="22"></z-icon></div>
        <h2 class="mt-4 text-lg font-semibold">Create your first short link</h2>
        <p class="mt-1 text-sm text-muted">Your clicks and visitors will show up here.</p>
        <a zButton routerLink="/app/links" class="mt-6"><z-icon name="plus" [size]="16"></z-icon>New link</a>
      </z-card>
    </ng-template>
  </ng-container>
</ng-container>
