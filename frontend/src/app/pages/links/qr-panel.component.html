<section class="card">
  <div class="qr">
    <img *ngIf="dataUrl" [src]="dataUrl" alt="QR code for {{ shortUrl(code) }}" [width]="size" [height]="size" />
    <div>
      <p><strong>{{ shortUrl(code) }}</strong></p>
      <p class="error" *ngIf="error">{{ error }}</p>
      <a *ngIf="dataUrl" class="button" [href]="dataUrl" [download]="code + '-qr.png'">Download PNG</a>
      <button type="button" class="secondary" (click)="closed.emit()">Close</button>
    </div>
  </div>
</section>
