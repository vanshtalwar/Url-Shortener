<app-link-create-form (created)="onCreated($event)"></app-link-create-form>

<app-qr-panel *ngIf="qrCode" [code]="qrCode" (closed)="qrCode = null"></app-qr-panel>

<section class="card">
  <h2>My links</h2>
  <p class="error" *ngIf="error">{{ error }}</p>
  <p class="muted" *ngIf="loading">Loading…</p>
  <p class="muted" *ngIf="!loading && links.length === 0">No links yet.</p>

  <table *ngIf="links.length > 0">
    <thead>
      <tr>
        <th>Short link</th>
        <th>Destination</th>
        <th>Clicks</th>
        <th>Expires</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let link of links; trackBy: trackById">
        <tr *ngIf="editingId !== link.id">
          <td><a [href]="shortUrl(link.code)" target="_blank" rel="noopener">{{ link.code }}</a></td>
          <td class="truncate" [title]="link.url">{{ link.url }}</td>
          <td>{{ link.clickCount }}</td>
          <td>
            <span *ngIf="!link.expiresAt" class="muted">Never</span>
            <span *ngIf="link.expiresAt" [class.error]="isExpired(link.expiresAt, now)">
              {{ isExpired(link.expiresAt, now) ? 'Expired' : (link.expiresAt | date: 'medium') }}
            </span>
          </td>
          <td class="actions">
            <a class="button secondary" [routerLink]="['/links', link.id]">Stats</a>
            <button class="secondary" (click)="copy(link)">{{ copiedId === link.id ? 'Copied!' : 'Copy' }}</button>
            <button class="secondary" (click)="qrCode = link.code">QR</button>
            <button class="secondary" (click)="startEdit(link)">Edit</button>
            <button class="danger" (click)="remove(link)">Delete</button>
          </td>
        </tr>
        <tr *ngIf="editingId === link.id">
          <td><input name="editAlias" [(ngModel)]="editForm.alias" /></td>
          <td><input class="grow" name="editUrl" type="url" [(ngModel)]="editForm.url" /></td>
          <td>{{ link.clickCount }}</td>
          <td><input name="editExpiresAt" type="datetime-local" [(ngModel)]="editForm.expiresAt" /></td>
          <td class="actions">
            <button (click)="saveEdit(link)">Save</button>
            <button class="secondary" (click)="editingId = null">Cancel</button>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</section>
