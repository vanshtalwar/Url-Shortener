<section class="card">
  <h2>Shorten a link</h2>
  <form class="form-row" (ngSubmit)="create()">
    <input class="grow" name="url" type="url" placeholder="https://example.com/long/page" [(ngModel)]="url" required />
    <input name="alias" placeholder="Custom alias (optional)" [(ngModel)]="alias" />
    <label class="muted">
      Expires
      <input name="expiresAt" type="datetime-local" [(ngModel)]="expiresAt" />
    </label>
    <button type="submit" [disabled]="creating || !url.trim()">Shorten</button>
  </form>
  <p class="error" *ngIf="error">{{ error }}</p>
</section>
