<p><a routerLink="/links">← My links</a></p>
<p class="error" *ngIf="error">{{ error }}</p>

<ng-container *ngIf="stats">
  <section class="card">
    <h2><a [href]="shortUrl(stats.link.code)" target="_blank" rel="noopener">{{ shortUrl(stats.link.code) }}</a></h2>
    <p class="muted truncate" [title]="stats.link.url">→ {{ stats.link.url }}</p>
    <label>
      <input type="checkbox" [(ngModel)]="includeBots" (change)="load()" />
      Include bot clicks
    </label>
  </section>

  <section class="tiles">
    <div class="card tile"><span class="muted">Clicks</span><strong>{{ stats.total }}</strong></div>
    <div class="card tile"><span class="muted">Unique visitors</span><strong>{{ stats.uniqueVisitors }}</strong></div>
    <div class="card tile"><span class="muted">Bot clicks</span><strong>{{ stats.botClicks }}</strong></div>
  </section>
</ng-container>

<!-- Canvas stays in the DOM so the chart can be drawn into it on every load. -->
<section class="card" [hidden]="!stats || stats.total === 0">
  <h3>Clicks per day (UTC)</h3>
  <div class="chart"><canvas #chart></canvas></div>
</section>

<ng-container *ngIf="stats">
  <p class="muted" *ngIf="stats.total === 0">No clicks yet.</p>

  <section class="breakdowns" *ngIf="stats.total > 0">
    <ng-container *ngTemplateOutlet="breakdown; context: { title: 'Referrers', items: stats.referrers }"></ng-container>
    <ng-container *ngTemplateOutlet="breakdown; context: { title: 'Browsers', items: stats.browsers }"></ng-container>
    <ng-container *ngTemplateOutlet="breakdown; context: { title: 'Operating systems', items: stats.os }"></ng-container>
    <ng-container *ngTemplateOutlet="breakdown; context: { title: 'Devices', items: stats.devices }"></ng-container>
  </section>
</ng-container>

<ng-template #breakdown let-title="title" let-items="items">
  <div class="card">
    <h3>{{ title }}</h3>
    <table>
      <tr *ngFor="let item of items">
        <td>{{ item.value }}</td>
        <td class="num">{{ item.count }}</td>
        <td class="num muted">{{ percent(item.count) }}%</td>
      </tr>
    </table>
  </div>
</ng-template>
