<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zelqit — short links with real analytics</title>
  <meta name="description" content="Zelqit shortens links and shows who clicks them: unique visitors, sources, devices and countries.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07060b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafe" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <script>
    // Apply the saved/system theme before Angular boots, so the page never flashes the wrong theme.
    // Same rule as ThemeService (src/app/ui/theme.service.ts); keep the two in sync.
    // Marketing pages always follow the system setting; the saved choice applies to the dashboard,
    // the auth pages (paths in src/app/route-matchers.ts) and link-in-bio pages.
    (function () {
      var pref = null;
      var saved = /^\/(?:(?:app|links|login|signup|check-email|verify-email|forgot-password|reset-password)(?:\/|$)|@)/.test(location.pathname);
      if (saved) try { pref = localStorage.getItem('zelqit-theme'); } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
